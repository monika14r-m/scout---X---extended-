name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "live_demo/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "live_demo/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install live-demo dependencies
        run: python -m pip install -r live_demo/requirements.txt
      - name: Compile live-demo package
        run: python -m compileall -q live_demo/scoutx_live
      - name: Run unit tests
        run: PYTHONPATH=live_demo python -m unittest discover -s live_demo/tests -v
